<div class="layout">
  <aside class="sidebar">
    <div class="marca">
      <div class="logo"><app-icon nombre="birrete" [size]="22" /></div>
      <div class="textos">
        <div class="titulo">EarlySign</div>
        <div class="subtitulo">Señales tempranas</div>
      </div>
    </div>

    <nav class="navegacion">
      <div class="etiqueta">Espacio de trabajo</div>
      @for (enlace of enlaces; track enlace.ruta) {
        <a class="enlace" [routerLink]="enlace.ruta" routerLinkActive="activo">
          <app-icon [nombre]="enlace.icono" [size]="18" />
          <span>{{ enlace.titulo }}</span>
        </a>
      }
    </nav>

    <div class="pie">
      <a class="politica" routerLink="/privacidad">
        <app-icon nombre="privacidad" [size]="16" />
        <span>Política de privacidad</span>
      </a>
      <div class="usuario">
        <div class="avatar" aria-hidden="true">{{ (usuario()?.email ?? '?')[0].toUpperCase() }}</div>
        <div class="datos">
          <span class="correo" [title]="usuario()?.email">{{ usuario()?.email }}</span>
          <span class="rol">Orientador</span>
        </div>
      </div>
      <button class="salir" (click)="cerrarSesion()">
        <app-icon nombre="salir" [size]="16" />
        Cerrar sesión
      </button>
      <div class="version">EarlySign v{{ version }}</div>
    </div>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
