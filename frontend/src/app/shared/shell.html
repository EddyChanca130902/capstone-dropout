<div class="layout">
  <aside class="sidebar">
    <div class="marca">
      <div class="logo">🎓</div>
      <div>
        <div class="titulo">AlertaTemprana</div>
        <div class="subtitulo">Seguimiento académico</div>
      </div>
    </div>

    <div class="bloque">
      <div class="etiqueta">Espacio de trabajo</div>
      @for (enlace of enlaces; track enlace.ruta) {
        <a class="enlace" [routerLink]="enlace.ruta" routerLinkActive="activo">
          <span>{{ enlace.icono }}</span>{{ enlace.titulo }}
        </a>
      }
    </div>

    <div class="pie">
      <p class="usuario">👋 {{ usuario()?.email ?? 'Orientador' }}</p>
      <button class="secundario salir" (click)="cerrarSesion()">↪ Cerrar sesión</button>
    </div>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
