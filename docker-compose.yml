services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - API_ENV=production
      - CORS_ORIGINS=http://localhost:8080
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
